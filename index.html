<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>YouTube</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #ffffff;
            position: relative;
        }

        /*
         * O Vivaldi captura principalmente a região superior
         * da página. Os 48% mantêm o ícone na posição correta
         * para o Speed Dial Grande.
         */
        .youtube-card {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 48%;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;
        }

        /*
         * Ícone do YouTube
         */
        .logo {
            width: 150px;
            height: 106px;

            background: #ff0000;

            border-radius: 25px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        /*
         * Triângulo de reprodução
         */
        .play {
            width: 0;
            height: 0;

            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;

            border-left: 40px solid #ffffff;

            margin-left: 8px;
        }

    </style>

    <script>

        /*
         * Mantemos a página visível por 500 ms para que
         * o Vivaldi tenha uma oportunidade de capturar
         * a miniatura antes do redirecionamento.
         */
        setTimeout(function () {

            window.location.replace("https://www.youtube.com/");

        }, 500);

    </script>

</head>

<body>

    <div class="youtube-card">

        <div class="logo">

            <div class="play"></div>

        </div>

    </div>

</body>
</html>
