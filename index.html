<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notícias</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f8fafd;
    color: #202124;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   CABEÇALHO
   ========================= */

.header {
    background: #ffffff;
    border-bottom: 1px solid #dadce0;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    padding: 14px 18px;
}

/* =========================
   PESQUISA
   ========================= */

.search {
    display: flex;
    align-items: center;
    gap: 10px;

    background: #f1f3f4;
    border-radius: 28px;

    padding: 0 18px;
    height: 52px;
}

.search-icon {
    font-size: 21px;
}

.search input {
    flex: 1;

    border: none;
    outline: none;

    background: transparent;

    font-size: 16px;
    color: #202124;
}

.search button {
    border: none;
    background: transparent;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

/* =========================
   CATEGORIAS
   ========================= */

.categories {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding-top: 13px;
    padding-bottom: 2px;

    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category-button {
    flex: 0 0 auto;

    border: none;

    background: transparent;

    padding: 8px 12px;

    border-radius: 20px;

    font-size: 14px;

    cursor: pointer;

    color: #5f6368;
}

.category-button:hover {
    background: #f1f3f4;
}

.category-button.active {
    background: #e8f0fe;
    color: #1967d2;
    font-weight: bold;
}

/* =========================
   CONTEÚDO
   ========================= */

.container {
    max-width: 1100px;

    margin: auto;

    padding: 22px 18px 50px;
}

.section-title {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 16px;
}

.section-title h1 {
    margin: 0;

    font-size: 25px;
}

.refresh {
    border: none;

    background: #ffffff;

    border: 1px solid #dadce0;

    border-radius: 20px;

    padding: 8px 14px;

    cursor: pointer;

    color: #3c4043;
}

/* =========================
   NOTÍCIAS
   ========================= */

.news-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 15px;
}

.news-card {
    background: #ffffff;

    border: 1px solid #dadce0;

    border-radius: 12px;

    padding: 17px;

    transition:
        transform .15s,
        box-shadow .15s;
}

.news-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 3px 12px
        rgba(60,64,67,.15);
}

.news-card a {
    color: inherit;

    text-decoration: none;
}

.news-source {
    color: #5f6368;

    font-size: 12px;

    margin-bottom: 8px;
}

.news-title {
    font-size: 17px;

    line-height: 1.4;

    font-weight: 600;
}

.news-time {
    margin-top: 12px;

    color: #80868b;

    font-size: 12px;
}

/* =========================
   CARREGANDO
   ========================= */

.loading {
    grid-column: 1 / -1;

    padding: 30px;

    text-align: center;

    color: #80868b;
}

/* =========================
   RODAPÉ
   ========================= */

footer {
    text-align: center;

    color: #80868b;

    font-size: 12px;

    padding: 30px;
}

/* =========================
   CELULAR
   ========================= */

@media (max-width: 600px) {

    .header-inner {
        padding: 10px 12px;
    }

    .container {
        padding: 18px 12px 40px;
    }

    .search {
        height: 48px;
    }

    .section-title h1 {
        font-size: 22px;
    }

    .news-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <form
            class="search"
            id="searchForm"
        >

            <span class="search-icon">
                🔍
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="Pesquisar na Web"
                autocomplete="off"
            >

            <button type="submit">
                Pesquisar
            </button>

        </form>


        <nav class="categories">

            <button
                class="category-button active"
                data-category="geral"
            >
                Início
            </button>

            <button
                class="category-button"
                data-category="brasil"
            >
                Brasil
            </button>

            <button
                class="category-button"
                data-category="mundo"
            >
                Mundo
            </button>

            <button
                class="category-button"
                data-category="economia"
            >
                Economia
            </button>

            <button
                class="category-button"
                data-category="tecnologia"
            >
                Tecnologia
            </button>

            <button
                class="category-button"
                data-category="ciencia"
            >
                Ciência
            </button>

            <button
                class="category-button"
                data-category="saude"
            >
                Saúde
            </button>

            <button
                class="category-button"
                data-category="esportes"
            >
                Esportes
            </button>

            <button
                class="category-button"
                data-category="entretenimento"
            >
                Entretenimento
            </button>

        </nav>

    </div>

</header>


<main class="container">

    <div class="section-title">

        <h1 id="sectionTitle">
            Principais notícias
        </h1>

        <button
            class="refresh"
            onclick="carregarNoticias()"
        >
            ↻ Atualizar
        </button>

    </div>


    <div
        id="news"
        class="news-grid"
    >

        <div class="loading">
            Carregando notícias...
        </div>

    </div>

</main>


<footer>
    Notícias agregadas de fontes públicas.
</footer>


<script>

/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

/*
 * Usamos RSS do Google Notícias.
 *
 * O Google News disponibiliza feeds de pesquisa,
 * permitindo montar consultas por assunto.
 */

const categorias = {

    geral:
        "notícias Brasil when:2d",

    brasil:
        "Brasil when:2d",

    mundo:
        "mundo when:2d",

    economia:
        "economia Brasil when:2d",

    tecnologia:
        "tecnologia when:2d",

    ciencia:
        "ciência when:2d",

    saude:
        "saúde when:2d",

    esportes:
        "esportes when:2d",

    entretenimento:
        "entretenimento when:2d"
};


/* =====================================================
   ELEMENTOS
   ===================================================== */

const newsContainer =
    document.getElementById("news");

const sectionTitle =
    document.getElementById("sectionTitle");


/* =====================================================
   GOOGLE NEWS RSS
   ===================================================== */

function criarFeedGoogleNoticias(
    consulta
) {

    return (
        "https://news.google.com/rss/search?q="
        +
        encodeURIComponent(consulta)
        +
        "&hl=pt-BR&gl=BR&ceid=BR:pt-419"
    );
}


/* =====================================================
   CARREGAR RSS
   ===================================================== */

async function carregarRSS(
    consulta
) {

    const url =
        criarFeedGoogleNoticias(
            consulta
        );

    /*
     * Proxy para permitir que o navegador
     * leia o RSS.
     */

    const proxy =
        "https://api.allorigins.win/raw?url="
        +
        encodeURIComponent(url);


    const resposta =
        await fetch(proxy);


    if (!resposta.ok) {

        throw new Error(
            "Não foi possível carregar as notícias."
        );
    }


    return await resposta.text();
}


/* =====================================================
   CONVERTER RSS
   ===================================================== */

function converterRSS(
    xml
) {

    const parser =
        new DOMParser();

    const documento =
        parser.parseFromString(
            xml,
            "text/xml"
        );


    const itens =
        Array.from(
            documento.querySelectorAll(
                "item"
            )
        );


    return itens.map(
        item => {

            const titulo =
                item.querySelector(
                    "title"
                )?.textContent
                || "Sem título";


            const link =
                item.querySelector(
                    "link"
                )?.textContent
                || "#";


            const data =
                item.querySelector(
                    "pubDate"
                )?.textContent
                || "";


            /*
             * O Google News costuma colocar
             * a fonte dentro de <source>.
             */

            const source =
                item.querySelector(
                    "source"
                )?.textContent
                || "Google Notícias";


            return {

                titulo,
                link,
                data,
                source

            };

        }
    );
}


/* =====================================================
   FORMATAR DATA
   ===================================================== */

function formatarData(
    data
) {

    if (!data) {

        return "";
    }


    const d =
        new Date(data);


    if (isNaN(d)) {

        return "";
    }


    const agora =
        new Date();


    const diferenca =
        Math.floor(
            (
                agora - d
            ) / 60000
        );


    if (diferenca < 1) {

        return "agora";
    }


    if (diferenca < 60) {

        return (
            "há "
            +
            diferenca
            +
            " min"
        );
    }


    const horas =
        Math.floor(
            diferenca / 60
        );


    if (horas < 24) {

        return (
            "há "
            +
            horas
            +
            " h"
        );
    }


    return d.toLocaleDateString(
        "pt-BR"
    );
}


/* =====================================================
   MOSTRAR NOTÍCIAS
   ===================================================== */

function mostrarNoticias(
    noticias
) {

    newsContainer.innerHTML = "";


    if (!noticias.length) {

        newsContainer.innerHTML = `
            <div class="loading">
                Nenhuma notícia encontrada.
            </div>
        `;

        return;
    }


    /*
     * Remove títulos repetidos.
     */

    const usadas =
        new Set();


    noticias
        .filter(
            noticia => {

                const chave =
                    noticia.titulo
                        .toLowerCase();

                if (
                    usadas.has(chave)
                ) {

                    return false;
                }

                usadas.add(chave);

                return true;
            }
        )
        .slice(0, 30)
        .forEach(
            noticia => {

                const card =
                    document.createElement(
                        "article"
                    );

                card.className =
                    "news-card";


                card.innerHTML = `

                    <a
                        href="${noticia.link}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="news-source">
                            ${escapar(
                                noticia.source
                            )}
                        </div>

                        <div class="news-title">
                            ${escapar(
                                noticia.titulo
                            )}
                        </div>

                        <div class="news-time">
                            ${formatarData(
                                noticia.data
                            )}
                        </div>

                    </a>

                `;


                newsContainer.appendChild(
                    card
                );

            }
        );
}


/* =====================================================
   SEGURANÇA
   ===================================================== */

function escapar(
    texto
) {

    return texto
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   CARREGAR CATEGORIA
   ===================================================== */

async function carregarNoticias(
    categoria = "geral"
) {

    newsContainer.innerHTML = `

        <div class="loading">

            Carregando notícias...

        </div>

    `;


    try {

        const xml =
            await carregarRSS(
                categorias[
                    categoria
                ]
            );


        const noticias =
            converterRSS(
                xml
            );


        mostrarNoticias(
            noticias
        );


    } catch (erro) {

        console.error(
            erro
        );


        newsContainer.innerHTML = `

            <div class="loading">

                Não foi possível carregar
                as notícias agora.

                <br><br>

                Tente novamente.

            </div>

        `;

    }
}


/* =====================================================
   CATEGORIAS
   ===================================================== */

document
    .querySelectorAll(
        ".category-button"
    )
    .forEach(
        botao => {

            botao.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".category-button"
                        )
                        .forEach(
                            b =>
                                b.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList.add(
                        "active"
                    );


                    const categoria =
                        this.dataset.category;


                    const nomes = {

                        geral:
                            "Principais notícias",

                        brasil:
                            "Brasil",

                        mundo:
                            "Mundo",

                        economia:
                            "Economia",

                        tecnologia:
                            "Tecnologia",

                        ciencia:
                            "Ciência",

                        saude:
                            "Saúde",

                        esportes:
                            "Esportes",

                        entretenimento:
                            "Entretenimento"
                    };


                    sectionTitle.textContent =
                        nomes[
                            categoria
                        ];


                    carregarNoticias(
                        categoria
                    );

                }
            );

        }
    );


/* =====================================================
   PESQUISA GERAL NA WEB
   ===================================================== */

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const consulta =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .trim();


            if (!consulta) {

                return;
            }


            window.location.href =
                "https://www.google.com/search?q="
                +
                encodeURIComponent(
                    consulta
                );

        }
    );


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

carregarNoticias(
    "geral"
);

</script>

</body>
</html>
